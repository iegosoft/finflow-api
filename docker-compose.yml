version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finflow_postgres
    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow@2026
      POSTGRES_DB: finflow_db
    ports:
      - "5432:5432"
    volumes:
      - finflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d finflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finflow_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=finflow_db;Username=finflow;Password=finflow@2026
      - Jwt__Chave=FINFLOW_JWT_SECRET_KEY_DEVE_SER_SUBSTITUIDA_EM_PRODUCAO
      - Jwt__Emissor=FinFlowAPI
      - Jwt__Audiencia=FinFlowCliente
      - Jwt__ExpiracaoHoras=1
      - Jwt__ExpiracaoRefreshTokenDias=7
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  finflow_postgres_data:
